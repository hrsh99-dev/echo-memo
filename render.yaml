# Render Blueprint — one-click deployment for EchoMemo
# Docs: https://render.com/docs/yaml-spec

services:
  # ─── Backend API ────────────────────────────────────────────────
  - type: web
    name: echomemo-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    rootDir: backend
    envVars:
      - key: APP_ENV
        value: production
      - key: FRONTEND_ORIGIN
        value: https://echomemo-frontend.onrender.com
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: echomemo
      - key: VECTOR_SEARCH_INDEX
        value: autoembed_index
      - key: AUTH_SECRET
        generateValue: true
      - key: AUTH_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: AUTH_REFRESH_TOKEN_EXPIRE_DAYS
        value: "30"
      - key: GEMINI_API_KEY
        sync: false
      - key: EMBEDDING_MODEL
        value: models/gemini-embedding-001
      - key: GENERATION_MODEL
        value: models/gemini-3.8-flash
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: AUDIO_RETENTION_ENABLED
        value: "false"
    healthCheckPath: /api/v1/health/live

  # ─── Frontend Static Site ───────────────────────────────────────
  - type: web
    name: echomemo-frontend
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    rootDir: frontend
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://echomemo-api.onrender.com
